services:
  - type: web
    name: telegram-hf-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false   # set manually in Render dashboard (secret)
      - key: HF_API_TOKEN
        sync: false   # Hugging Face token with "Make calls to Inference Providers"
      - key: HF_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: HF_PROVIDER
        value: featherless-ai   # do NOT set hf-inference — that provider 403s this model
