services:
  - type: web
    name: telegram-hf-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false   # Telegram BotFather token
      - key: GROQ_API_KEY
        sync: false   # free key from https://console.groq.com/keys  ← required
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: HF_API_TOKEN
        sync: false   # optional leftover; HF free credits are already exhausted
