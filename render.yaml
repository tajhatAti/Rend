services:
  - type: web
    name: telegram-hf-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false   # Telegram BotFather token
      - key: HF_SPACE_ID
        sync: false   # e.g. username/my-space  ← the Space Render will call
      - key: HF_SPACE_API
        value: /predict   # Gradio endpoint; change if the Space uses /chat etc.
      - key: HF_API_TOKEN
        sync: false   # needed only if the Space is private
      - key: GROQ_API_KEY
        sync: false   # optional text-chat fallback
